<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Predict Property Price</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    /* Navbar styles (copied & adapted from your compare page CSS) */
    .navbar {
      background-color: #1E90FF; /* blue background */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }
    .navbar .logo {
      font-size: 22px;
      user-select: none;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    .nav-links li a {
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }
    .nav-links li a:hover {
      background-color: #63a4ff;
    }
    .nav-links li a.active {
      background-color: #0c71d4;
      font-weight: bold;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      margin: 0;
      padding: 0;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #ffffffee;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .switch-field {
      display: flex;
      justify-content: center;
      margin: 15px 0;
      gap: 10px;
    }

    .switch-field input[type="radio"] {
      display: none;
    }

    /* Changed checked background from green to blue */
    .switch-field label {
      padding: 10px 20px;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .switch-field input:checked + label {
      background-color: #87CEFA; /* LightSkyBlue */
      font-weight: bold;
    }

    /* Changed submit button green to blue */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #1E90FF; /* DodgerBlue */
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .result, #affordable-note {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
    }

    .mini-info {
      margin-top: 20px;
      background: #f7f7f7;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    #map {
      height: 350px;
      width: 100%;
      border-radius: 16px;
      margin-top: 20px;
    }

    .map-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      font-size: 14px;
      color: #555;
      text-align: center;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1E90FF; /* spinner blue */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #nearbyPlaces {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
    }

    .conversion-box {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .conversion-box label {
      display: block;
      margin-bottom: 10px;
    }

    .conversion-box select,
    .conversion-box input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-right: 10px;
    }

    .conversion-box strong {
      display: block;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR ADDED -->
  <nav class="navbar">
    <div class="logo">🏠 RealEstateAI</div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/predict" class="active">Predict</a></li>
      <li><a href="/compare">Compare</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>🏡 Predict Property Price in Bangalore</h2>
    <input type="text" id="uiSqft" placeholder="Enter Total Square Feet" />

    <div class="switch-field">
      <input type="radio" id="bhk1" name="uiBHK" value="1" />
      <label for="bhk1">1 BHK</label>
      <input type="radio" id="bhk2" name="uiBHK" value="2" />
      <label for="bhk2">2 BHK</label>
      <input type="radio" id="bhk3" name="uiBHK" value="3" />
      <label for="bhk3">3 BHK</label>
    </div>

    <div class="switch-field">
      <input type="radio" id="bath1" name="uiBathrooms" value="1" />
      <label for="bath1">1 Bath</label>
      <input type="radio" id="bath2" name="uiBathrooms" value="2" />
      <label for="bath2">2 Bath</label>
      <input type="radio" id="bath3" name="uiBathrooms" value="3" />
      <label for="bath3">3 Bath</label>
    </div>

    <select id="uiLocations">
      <option selected disabled>Select Location</option>
    </select>

    <button class="submit-btn" onclick="onClickedEstimatePrice()">Estimate Price</button>

    <div class="result" id="uiEstimatedPrice">Estimated price will appear here.</div>
    <div id="affordable-note"></div>
    <div class="mini-info" id="miniInfoBox"></div>

    <div id="mapLoading" class="map-loading">
      <div class="spinner"></div>
      <p>Fetching location and nearby places...</p>
    </div>
    <div id="map"></div>
    <div id="nearbyPlaces"></div>

    <div class="conversion-box">
      <label>
        Convert to Sqft:
        <input type="number" id="unitValue" placeholder="Enter value" />
        <select id="unitType">
          <option value="metre">Metres</option>
          <option value="hectare">Hectares</option>
          <option value="acre">Acres</option>
        </select>
      </label>
      <strong>Total in Sqft: <span id="totalSqft">0</span></strong>
    </div>
  </div>

  <script>
    let map, marker;

    function initMap() {
      map = L.map('map').setView([12.9716, 77.5946], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }

    function updateMapUsingGeocode(locationName) {
      const loadingEl = document.getElementById("mapLoading");
      loadingEl.style.display = "flex";
      document.getElementById("nearbyPlaces").innerHTML = "";

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationName + ', Bangalore')}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map).bindPopup(locationName).openPopup();
            map.setView([lat, lon], 15);
            fetchNearbyPlaces(lat, lon);
          } else {
            loadingEl.innerHTML = "❗ Location not found. Try a different name.";
          }
        })
        .catch(() => {
          loadingEl.innerHTML = "❗ Error fetching location.";
        });
    }

    function fetchNearbyPlaces(lat, lon) {
      const apiUrl = `https://overpass-api.de/api/interpreter?data=[out:json];(node["amenity"~"hospital|school"](around:3000,${lat},${lon}););out;`;

      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          const places = data.elements
            .filter(el => el.tags && el.tags.name)
            .map(el => ({
              name: el.tags.name,
              distance: haversineDistance(lat, lon, el.lat, el.lon)
            }))
            .sort((a, b) => a.distance - b.distance)
            .slice(0, 5);

          const output = places.map(p => `📍 ${p.name} (${p.distance.toFixed(2)} km)`).join("<br>");
          document.getElementById("nearbyPlaces").innerHTML = "<strong>Nearby Places:</strong><br>" + output;
          document.getElementById("mapLoading").style.display = "none";
        })
        .catch(() => {
          document.getElementById("nearbyPlaces").innerHTML = "❗ Failed to load nearby places.";
          document.getElementById("mapLoading").style.display = "none";
        });
    }

    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function onClickedEstimatePrice() {
      const sqft = document.getElementById("uiSqft").value;
      const bhk = document.querySelector('input[name="uiBHK"]:checked')?.value;
      const bath = document.querySelector('input[name="uiBathrooms"]:checked')?.value;
      const location = document.getElementById("uiLocations").value;

      if (!(sqft && bhk && bath && location)) {
        alert("Please fill in all details");
        return;
      }

      showMiniInfo();
      updateMapUsingGeocode(location);

      $.post("/predict_home_price", {
        total_sqft: parseFloat(sqft),
        bhk: parseInt(bhk),
        bath: parseInt(bath),
        location: location
      }, function(data) {
        const price = data.estimated_price;
        document.getElementById("uiEstimatedPrice").innerHTML = "₹ " + price + " Lakh";
        let note = "";
        if (price <= 40) note = "✅ This property is affordable.";
        else if (price <= 80) note = "💡 This is moderately priced.";
        else note = "🔔 Premium / luxury segment.";
        document.getElementById("affordable-note").innerText = note;
      });
    }

    function showMiniInfo() {
      const sqft = document.getElementById("uiSqft").value;
      const bhk = document.querySelector('input[name="uiBHK"]:checked')?.value || "";
      const bath = document.querySelector('input[name="uiBathrooms"]:checked')?.value || "";
      const loc = document.getElementById("uiLocations").value;

      if (sqft && bhk && bath && loc) {
        const infoBox = document.getElementById("miniInfoBox");
        infoBox.style.display = "block";
        infoBox.innerHTML = `<strong>Location:</strong> ${loc}<br><strong>Area:</strong> ${sqft} sqft<br><strong>BHK:</strong> ${bhk} | <strong>Bath:</strong> ${bath}`;
      }
    }

    function convertUnits() {
      const val = parseFloat(document.getElementById("unitValue").value) || 0;
      const type = document.getElementById("unitType").value;
      let sqft = 0;

      if (type === "metre") sqft = val * 10.7639;
      else if (type === "hectare") sqft = val * 107639;
      else if (type === "acre") sqft = val * 43560;

      document.getElementById("totalSqft").innerText = sqft.toFixed(2);
    }

    window.onload = function() {
      initMap();
      // Load locations for dropdown - you can fetch from server if needed
      // New dynamic fetch
fetch("/get_location_names")
  .then(res => res.json())
  .then(data => {
    const locations = data.locations;
    const locationSelect = document.getElementById("uiLocations");

    locations.forEach(loc => {
      let option = document.createElement("option");
      option.text = loc.charAt(0).toUpperCase() + loc.slice(1);
      option.value = loc;
      locationSelect.add(option);
    });
  });

      document.getElementById("unitValue").addEventListener("input", convertUnits);
      document.getElementById("unitType").addEventListener("change", convertUnits);
    };
  </script>
</body>
</html>
